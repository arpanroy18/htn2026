<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, height=844" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f6f6f6; font-family: Inter, system-ui, sans-serif; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f6f6; }
    .status { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
    .header { padding: 8px 24px 14px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 28px; font-weight: 800; color: #1b1b1b; }
    .plus { width: 36px; height: 36px; border-radius: 50%; background: #2c6bed; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; }
    .section { padding: 0 24px; font-size: 22px; font-weight: 800; color: #1b1b1b; margin-bottom: 10px; }
    .alert-card { margin: 0 24px; background: #fff; border: 2px solid #e53935; border-radius: 16px; padding: 18px; position: relative; }
    .chip { display: inline-block; background: #c62828; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 2px; border-radius: 8px; padding: 6px 12px; }
    .body { font-size: 17px; font-weight: 600; color: #1b1b1b; margin-top: 12px; line-height: 1.35; }
    .meta { font-size: 13px; color: #404654; margin-top: 10px; }
    .rings { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; pointer-events: none; }
    .ring { position: absolute; inset: 0; border: 3px solid #e53935; border-radius: 50%; }
    .peers { margin: 24px; display: flex; justify-content: center; gap: 20px; }
    .pdot { width: 48px; height: 48px; border-radius: 50%; background: #1b1b1b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .cap { text-align: center; font-size: 14px; font-weight: 600; color: #1b1b1b; margin-top: 8px; padding: 0 24px; }
    .tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: #fff; border-top: 1px solid #e9e9e9; display: flex; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #404654; }
    .tab.on { color: #2942ff; }
    .tab .ic { width: 22px; height: 22px; border-radius: 6px; background: #e9e9e9; }
    .tab.on .ic { background: #9dbbf8; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="alert-demo" data-start="0" data-width="390" data-height="844" data-duration="3">
    <div class="status">9:41</div>
    <div class="header"><h1>Alerts</h1><div class="plus">+</div></div>
    <div class="section">Inbox</div>
    <div class="alert-card" id="card" style="opacity:0;">
      <div class="rings">
        <div class="ring" id="r1" style="opacity:0;"></div>
        <div class="ring" id="r2" style="opacity:0;"></div>
      </div>
      <span class="chip">HELP</span>
      <div class="body">Hiker injured at mile 4 &#8212; need stretcher</div>
      <div class="meta">Maya &#8226; 2 hops &#8226; Location attached</div>
    </div>
    <div class="peers" id="peers" style="opacity:0;">
      <div class="pdot" id="d1">A</div>
      <div class="pdot" id="d2" style="background:#2c6bed;">B</div>
      <div class="pdot" id="d3">C</div>
    </div>
    <div class="cap" id="cap" style="opacity:0;">Bypasses mute. Pinned. Everyone.</div>
    <div class="tabs">
      <div class="tab"><div class="ic"></div>Nearby</div>
      <div class="tab"><div class="ic"></div>Chats</div>
      <div class="tab on"><div class="ic"></div>Alerts</div>
      <div class="tab"><div class="ic"></div>Games</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#card", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.4 }, 0.3);
    tl.to("#card", { x: -8, duration: 0.06 }, 0.75);
    tl.to("#card", { x: 8, duration: 0.06 }, 0.81);
    tl.to("#card", { x: -5, duration: 0.06 }, 0.87);
    tl.to("#card", { x: 5, duration: 0.06 }, 0.93);
    tl.to("#card", { x: 0, duration: 0.06 }, 0.99);
    tl.fromTo("#r1", { opacity: 0.8, scale: 0.5 }, { opacity: 0, scale: 1.8, duration: 0.9 }, 0.8);
    tl.fromTo("#r2", { opacity: 0.8, scale: 0.5 }, { opacity: 0, scale: 2.2, duration: 0.9 }, 1.0);
    tl.fromTo("#peers", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35 }, 1.4);
    tl.fromTo("#d1", { scale: 0.8 }, { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 1.5);
    tl.fromTo("#d2", { scale: 0.8 }, { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 1.65);
    tl.fromTo("#d3", { scale: 0.8 }, { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 1.8);
    tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 2.2);
    window.__timelines["alert-demo"] = tl;
  </script>
</body>
</html>
