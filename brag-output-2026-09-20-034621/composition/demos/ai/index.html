<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, height=844" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f6f6f6; font-family: Inter, system-ui, sans-serif; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f6f6; display: flex; flex-direction: column; }
    .status { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
    .chat-header { padding: 8px 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e9e9e9; background: #fff; }
    .chat-header .av { width: 40px; height: 40px; border-radius: 50%; background: #2942ff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .chat-header .nm { font-size: 18px; font-weight: 700; }
    .messages { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .audio-bub { align-self: flex-start; background: #fff; border: 1px solid #e9e9e9; border-radius: 20px; border-bottom-left-radius: 6px; padding: 14px 16px; width: 85%; }
    .wave-row { display: flex; align-items: center; gap: 10px; }
    .play { width: 44px; height: 44px; border-radius: 50%; background: #2c6bed; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
    .bars { display: flex; align-items: center; gap: 3px; height: 32px; flex: 1; }
    .bars i { width: 4px; border-radius: 3px; background: #2c6bed; display: block; }
    .dur { font-size: 13px; font-weight: 600; color: #404654; }
    .see { margin-top: 12px; font-size: 14px; font-weight: 600; color: #2c6bed; }
    .transcript { margin-top: 10px; font-size: 15px; color: #1b1b1b; line-height: 1.4; min-height: 22px; }
    .tr-chip { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #404654; }
    .tr-line { font-size: 15px; font-style: italic; color: #1b1b1b; margin-top: 4px; }
    .photo { align-self: flex-end; width: 160px; height: 120px; border-radius: 16px; background: linear-gradient(135deg, #9dbbf8 0%, #2942ff 100%); position: relative; overflow: hidden; }
    .photo .sun { position: absolute; top: 16px; right: 20px; width: 36px; height: 36px; border-radius: 50%; background: #ffe08a; }
    .photo .mt { position: absolute; bottom: -20px; left: -10px; width: 100px; height: 100px; background: #1b1b1b; transform: rotate(45deg); border-radius: 12px; }
    .cursor { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: rgba(44,107,237,0.25); border: 2px solid #2c6bed; z-index: 10; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="ai-demo" data-start="0" data-width="390" data-height="844" data-duration="3.5">
    <div class="status">9:41</div>
    <div class="chat-header">
      <div class="av">T</div>
      <div><div class="nm">Theo</div></div>
    </div>
    <div class="messages">
      <div class="audio-bub" id="audioCard">
        <div class="wave-row">
          <div class="play">&#9654;</div>
          <div class="bars" id="bars">
            <i style="height:12px"></i><i style="height:22px"></i><i style="height:16px"></i><i style="height:28px"></i>
            <i style="height:18px"></i><i style="height:30px"></i><i style="height:14px"></i><i style="height:26px"></i>
            <i style="height:20px"></i><i style="height:32px"></i><i style="height:15px"></i><i style="height:24px"></i>
          </div>
          <div class="dur">0:47</div>
        </div>
        <div class="see" id="seeBtn">See transcription</div>
        <div class="transcript" id="transcript"></div>
        <div id="trwrap" style="opacity:0;">
          <div class="tr-chip">TRANSLATED &#8212; FR</div>
          <div class="tr-line">&#8220;rendez-vous &#224; la porte nord&#8221;</div>
        </div>
      </div>
      <div class="photo" id="photo" style="opacity:0;"><div class="sun"></div><div class="mt"></div></div>
    </div>
    <div class="cursor" id="cursor" style="opacity:0; left: 120px; top: 280px;"></div>
  </div>
  <script>
    const text = "\u201cmeet at the north gate\u201d";
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#audioCard", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35 }, 0.3);
    tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.9);
    tl.to("#cursor", { left: 100, top: 250, duration: 0.4 }, 1.0);
    tl.call(() => {
      const el = document.getElementById("transcript");
      let i = 0;
      const tick = () => { if (i <= text.length) { el.textContent = text.slice(0, i); i++; } };
      gsap.timeline().call(tick, null, 0).call(tick, null, 0.06).call(tick, null, 0.12).call(tick, null, 0.18)
        .call(tick, null, 0.24).call(tick, null, 0.30).call(tick, null, 0.36).call(tick, null, 0.42)
        .call(tick, null, 0.48).call(tick, null, 0.54).call(tick, null, 0.60).call(tick, null, 0.66)
        .call(tick, null, 0.72).call(tick, null, 0.78).call(tick, null, 0.84).call(tick, null, 0.90)
        .call(tick, null, 0.96).call(tick, null, 1.02).call(tick, null, 1.08).call(tick, null, 1.14)
        .call(tick, null, 1.20).call(tick, null, 1.26).call(tick, null, 1.32).call(tick, null, 1.38)
        .call(tick, null, 1.44).call(tick, null, 1.50);
    }, null, 1.5);
    tl.fromTo("#trwrap", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35 }, 2.4);
    tl.fromTo("#photo", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4 }, 2.8);
    tl.to("#cursor", { opacity: 0, duration: 0.2 }, 1.4);
    window.__timelines["ai-demo"] = tl;
  </script>
</body>
</html>
