[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectra-search"
version = "0.1.0"
description = "A from-scratch vector search library: HNSW indexing, quantization, mmap persistence, metadata filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vectra = "vectra.cli:main"

[tool.setuptools.packages.find]
include = ["vectra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
